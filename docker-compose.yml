services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      fhe-worker:
        condition: service_started
    env_file: ./backend/.env
    environment:
      DB_PROVIDER: postgres
      DATABASE_URL: postgresql://muhaven:${DB_PASSWORD:-muhaven}@postgres:5432/muhaven
      FHE_WORKER_URL: http://fhe-worker:3001
      NAV_WORKER_URL: http://nav-worker:3002
      PORT: 3000
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: muhaven
      POSTGRES_USER: muhaven
      POSTGRES_PASSWORD: ${DB_PASSWORD:-muhaven}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muhaven"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fhe-worker:
    build: ./fhe-worker
    ports:
      - "3001:3001"
    env_file: ./fhe-worker/.env
    environment:
      PORT: 3001
    restart: unless-stopped

  nav-worker:
    build: ./nav-worker
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://muhaven:${DB_PASSWORD:-muhaven}@postgres:5432/muhaven
      NAV_FETCH_INTERVAL_MS: ${NAV_FETCH_INTERVAL_MS:-3600000}
      FRED_API_KEY: ${FRED_API_KEY:-}
      ETH_MAINNET_RPC_URL: ${ETH_MAINNET_RPC_URL:-}
      ARB_RPC_URL: ${ARB_RPC_URL:-}
    restart: unless-stopped

  nav-publisher:
    build: ./nav-publisher
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      nav-worker:
        condition: service_started
    env_file: ./nav-publisher/.env
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://muhaven:${DB_PASSWORD:-muhaven}@postgres:5432/muhaven
    restart: unless-stopped

  # Wave 4 P4 — Telegram bot worker. OpenClaw three-tier confirmation
  # surface. Refuses to start without TELEGRAM_BOT_TOKEN +
  # TELEGRAM_BOT_SERVICE_SECRET + TELEGRAM_WEBHOOK_SECRET_TOKEN; comment
  # this block out to disable the integration entirely.
  telegram-bot:
    build: ./telegram-bot
    ports:
      - "3004:3004"
    depends_on:
      backend:
        condition: service_started
    env_file: ./telegram-bot/.env
    environment:
      PORT: 3004
      TELEGRAM_BOT_BACKEND_URL: http://backend:3000
    restart: unless-stopped

volumes:
  pgdata:
