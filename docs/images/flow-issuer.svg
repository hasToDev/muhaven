<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <marker id="a4d" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ccc"/>
    </marker>
  </defs>

  <rect width="900" height="660" rx="12" fill="#1a1a1a"/>

  <text x="450" y="38" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Flow 4: Two-Sided Architecture — Issuer &amp; Investor</text>

  <!-- Outer container -->
  <rect x="30" y="60" width="840" height="550" rx="12" fill="none" stroke="#444" stroke-width="1"/>

  <!-- ISSUER SIDE label -->
  <text x="230" y="85" text-anchor="middle" fill="#D85A30" font-size="13" font-weight="600" letter-spacing="1">ISSUER SIDE (supply)</text>

  <!-- INVESTOR SIDE label -->
  <text x="670" y="85" text-anchor="middle" fill="#1D9E75" font-size="13" font-weight="600" letter-spacing="1">INVESTOR SIDE (demand)</text>

  <!-- Issuer Dashboard box -->
  <rect x="80" y="100" width="260" height="145" rx="10" fill="#222" stroke="#D85A30" stroke-width="1.5"/>
  <text x="210" y="124" text-anchor="middle" fill="#D85A30" font-size="14" font-weight="600">Issuer Dashboard</text>
  <line x1="100" y1="133" x2="320" y2="133" stroke="#333" stroke-width="1"/>
  <circle cx="110" cy="152" r="4" fill="#D85A30"/>
  <text x="122" y="156" fill="#ccc" font-size="12">Create token</text>
  <circle cx="110" cy="174" r="4" fill="#D85A30"/>
  <text x="122" y="178" fill="#ccc" font-size="12">Deposit yield</text>
  <circle cx="110" cy="196" r="4" fill="#D85A30"/>
  <text x="122" y="200" fill="#ccc" font-size="12">Manage investors</text>
  <circle cx="110" cy="218" r="4" fill="#D85A30"/>
  <text x="122" y="222" fill="#ccc" font-size="12">Compliance</text>

  <!-- AI Agent box -->
  <rect x="540" y="100" width="260" height="145" rx="10" fill="#222" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="670" y="124" text-anchor="middle" fill="#1D9E75" font-size="14" font-weight="600">AI Agent + Chat</text>
  <line x1="560" y1="133" x2="780" y2="133" stroke="#333" stroke-width="1"/>
  <circle cx="560" cy="152" r="4" fill="#1D9E75"/>
  <text x="572" y="156" fill="#ccc" font-size="12">Advisory</text>
  <circle cx="560" cy="174" r="4" fill="#1D9E75"/>
  <text x="572" y="178" fill="#ccc" font-size="12">Portfolio management</text>
  <circle cx="560" cy="196" r="4" fill="#1D9E75"/>
  <text x="572" y="200" fill="#ccc" font-size="12">Yield claiming</text>
  <circle cx="560" cy="218" r="4" fill="#1D9E75"/>
  <text x="572" y="222" fill="#ccc" font-size="12">Risk guardrails</text>

  <!-- Arrows down -->
  <line x1="210" y1="245" x2="210" y2="290" stroke="#D85A30" stroke-width="2" marker-end="url(#a4d)"/>
  <line x1="670" y1="245" x2="670" y2="290" stroke="#1D9E75" stroke-width="2" marker-end="url(#a4d)"/>

  <!-- Shared contracts box -->
  <rect x="80" y="295" width="720" height="120" rx="10" fill="#222" stroke="#888780" stroke-width="1.5"/>
  <text x="440" y="320" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">MuHaven Contracts</text>
  <text x="440" y="338" text-anchor="middle" fill="#888780" font-size="11">← shared by both sides →</text>

  <!-- Contract pills inside -->
  <rect x="100" y="350" width="170" height="30" rx="6" fill="#333" stroke="#D85A30" stroke-width="1"/>
  <text x="185" y="370" text-anchor="middle" fill="#D85A30" font-size="11" font-weight="500">MuHavenToken (fhERC-20)</text>

  <rect x="290" y="350" width="160" height="30" rx="6" fill="#333" stroke="#EF9F27" stroke-width="1"/>
  <text x="370" y="370" text-anchor="middle" fill="#EF9F27" font-size="11" font-weight="500">MuHavenVault</text>

  <rect x="470" y="350" width="160" height="30" rx="6" fill="#333" stroke="#7F77DD" stroke-width="1"/>
  <text x="550" y="370" text-anchor="middle" fill="#7F77DD" font-size="11" font-weight="500">YieldDistributor</text>

  <rect x="650" y="350" width="130" height="30" rx="6" fill="#333" stroke="#1D9E75" stroke-width="1"/>
  <text x="715" y="370" text-anchor="middle" fill="#1D9E75" font-size="11" font-weight="500">IKYCGate</text>

  <text x="160" y="403" text-anchor="middle" fill="#888780" font-size="10">mint() (MINTER_ROLE) / depositYield()</text>
  <text x="370" y="403" text-anchor="middle" fill="#888780" font-size="10">wrap() / unwrap()</text>
  <text x="550" y="403" text-anchor="middle" fill="#888780" font-size="10">distributeYield()</text>
  <text x="715" y="403" text-anchor="middle" fill="#888780" font-size="10">isEligible()</text>

  <!-- Arrow down to infrastructure -->
  <line x1="440" y1="415" x2="440" y2="460" stroke="#888780" stroke-width="2" marker-end="url(#a4d)"/>

  <!-- Infrastructure box -->
  <rect x="80" y="465" width="720" height="55" rx="10" fill="#222" stroke="#555" stroke-width="1"/>
  <rect x="100" y="476" width="160" height="30" rx="6" fill="#1D9E75" opacity="0.2" stroke="#1D9E75" stroke-width="1"/>
  <text x="180" y="496" text-anchor="middle" fill="#1D9E75" font-size="12" font-weight="500">ReineiraOS (PUSDC)</text>

  <rect x="290" y="476" width="180" height="30" rx="6" fill="#7F77DD" opacity="0.2" stroke="#7F77DD" stroke-width="1"/>
  <text x="380" y="496" text-anchor="middle" fill="#7F77DD" font-size="12" font-weight="500">ReineiraOS (escrow)</text>

  <rect x="500" y="476" width="280" height="30" rx="6" fill="#888780" opacity="0.2" stroke="#888780" stroke-width="1"/>
  <text x="640" y="496" text-anchor="middle" fill="#888780" font-size="12" font-weight="500">Fhenix CoFHE (FHE coprocessor)</text>

  <!-- Bottom insight -->
  <rect x="100" y="545" width="700" height="50" rx="8" fill="#222" stroke="#EF9F27" stroke-width="1"/>
  <text x="450" y="565" text-anchor="middle" fill="#EF9F27" font-size="12" font-weight="500">Key insight: Issuers and investors share the same smart contracts</text>
  <text x="450" y="582" text-anchor="middle" fill="#888780" font-size="11">Issuer sees aggregates · Investor sees own position · Nobody sees others</text>
</svg>
