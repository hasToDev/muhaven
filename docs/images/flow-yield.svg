<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ccc"/>
    </marker>
    <marker id="a2b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#378ADD"/>
    </marker>
    <marker id="a2c" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#D85A30"/>
    </marker>
    <marker id="a2p" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7F77DD"/>
    </marker>
    <marker id="a2t" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#1D9E75"/>
    </marker>
    <marker id="a2r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#E05252"/>
    </marker>
  </defs>

  <rect width="960" height="720" rx="12" fill="#1a1a1a"/>

  <text x="480" y="38" text-anchor="middle" fill="#fff" font-size="18" font-weight="600">Flow 2: Yield Distribution via ReineiraOS Escrow</text>

  <!-- Column headers -->
  <rect x="40" y="58" width="120" height="40" rx="8" fill="#378ADD"/>
  <text x="100" y="83" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Issuer</text>

  <rect x="230" y="58" width="150" height="40" rx="8" fill="#D85A30"/>
  <text x="305" y="83" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">MuHavenToken</text>

  <rect x="450" y="58" width="160" height="40" rx="8" fill="#EF9F27"/>
  <text x="530" y="83" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">YieldDistributor</text>

  <rect x="680" y="58" width="120" height="40" rx="8" fill="#7F77DD"/>
  <text x="740" y="83" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">ReineiraOS</text>

  <rect x="850" y="58" width="80" height="40" rx="8" fill="#1D9E75"/>
  <text x="890" y="83" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Investor</text>

  <!-- Lifelines -->
  <line x1="100" y1="98" x2="100" y2="680" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="305" y1="98" x2="305" y2="680" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="530" y1="98" x2="530" y2="680" stroke="#EF9F27" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="740" y1="98" x2="740" y2="680" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <line x1="890" y1="98" x2="890" y2="680" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Step 1: depositYield -->
  <line x1="100" y1="140" x2="297" y2="140" stroke="#D85A30" stroke-width="2" marker-end="url(#a2c)"/>
  <rect x="112" y="120" width="180" height="24" rx="4" fill="#1a1a1a"/>
  <text x="200" y="137" text-anchor="middle" fill="#D85A30" font-size="12" font-weight="500">1. depositYield($50K)</text>

  <!-- Step 2: transfer USDC -->
  <line x1="305" y1="190" x2="522" y2="190" stroke="#ccc" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="325" y="170" width="180" height="24" rx="4" fill="#1a1a1a"/>
  <text x="415" y="187" text-anchor="middle" fill="#ccc" font-size="12" font-weight="500">2. Transfer USDC + call</text>
  <text x="415" y="202" text-anchor="middle" fill="#888780" font-size="11">distributeYield()</text>

  <!-- Step 3: read balances -->
  <line x1="522" y1="250" x2="313" y2="250" stroke="#D85A30" stroke-width="2" marker-end="url(#a2c)"/>
  <rect x="330" y="230" width="190" height="24" rx="4" fill="#1a1a1a"/>
  <text x="425" y="247" text-anchor="middle" fill="#D85A30" font-size="12" font-weight="500">3. Read encrypted balances</text>
  <text x="425" y="262" text-anchor="middle" fill="#888780" font-size="11">for each investor</text>

  <!-- Step 4: FHE math -->
  <rect x="445" y="295" width="170" height="50" rx="8" fill="#222" stroke="#EF9F27" stroke-width="1"/>
  <text x="530" y="315" text-anchor="middle" fill="#EF9F27" font-size="12" font-weight="500">4. FHE proportional</text>
  <text x="530" y="332" text-anchor="middle" fill="#EF9F27" font-size="12" font-weight="500">math (encrypted)</text>

  <!-- Step 5: create escrows -->
  <line x1="530" y1="370" x2="732" y2="370" stroke="#7F77DD" stroke-width="2" marker-end="url(#a2p)"/>
  <rect x="555" y="350" width="175" height="24" rx="4" fill="#1a1a1a"/>
  <text x="642" y="367" text-anchor="middle" fill="#7F77DD" font-size="12" font-weight="500">5. Create escrow/investor</text>

  <!-- Step 6: YieldGate check -->
  <rect x="650" y="400" width="180" height="60" rx="8" fill="#222" stroke="#7F77DD" stroke-width="1"/>
  <text x="740" y="420" text-anchor="middle" fill="#7F77DD" font-size="12" font-weight="600">6. YieldGate checks:</text>
  <text x="740" y="438" text-anchor="middle" fill="#1D9E75" font-size="11">✓ Holds tokens?</text>
  <text x="740" y="452" text-anchor="middle" fill="#1D9E75" font-size="11">✓ KYC valid?</text>

  <!-- Step 7a: release (yes) -->
  <line x1="740" y1="470" x2="882" y2="510" stroke="#1D9E75" stroke-width="2" marker-end="url(#a2t)"/>
  <rect x="758" y="478" width="110" height="22" rx="4" fill="#1a1a1a"/>
  <text x="813" y="493" text-anchor="middle" fill="#1D9E75" font-size="11" font-weight="500">Yes → Release</text>

  <!-- Step 7b: zero (no) -->
  <line x1="740" y1="470" x2="740" y2="520" stroke="#E05252" stroke-width="2" marker-end="url(#a2r)"/>
  <rect x="650" y="522" width="180" height="22" rx="4" fill="#1a1a1a"/>
  <text x="740" y="537" text-anchor="middle" fill="#E05252" font-size="11" font-weight="500">No → Zero transfer (no leak)</text>

  <!-- Step 8: auto-claim -->
  <rect x="820" y="555" width="140" height="40" rx="8" fill="#222" stroke="#1D9E75" stroke-width="1"/>
  <text x="890" y="572" text-anchor="middle" fill="#1D9E75" font-size="11" font-weight="500">8. AI agent</text>
  <text x="890" y="586" text-anchor="middle" fill="#1D9E75" font-size="11" font-weight="500">auto-claims yield</text>

  <!-- Issuer visibility note -->
  <rect x="30" y="620" width="260" height="60" rx="8" fill="#222" stroke="#378ADD" stroke-width="1"/>
  <text x="160" y="640" text-anchor="middle" fill="#378ADD" font-size="12" font-weight="600">Issuer sees:</text>
  <text x="160" y="656" text-anchor="middle" fill="#888780" font-size="11">Total distributed, investor count</text>
  <text x="160" y="670" text-anchor="middle" fill="#E05252" font-size="11">NOT individual positions</text>

  <!-- Investor note -->
  <rect x="650" y="620" width="280" height="60" rx="8" fill="#222" stroke="#1D9E75" stroke-width="1"/>
  <text x="790" y="640" text-anchor="middle" fill="#1D9E75" font-size="12" font-weight="600">Investor sees:</text>
  <text x="790" y="656" text-anchor="middle" fill="#888780" font-size="11">Own yield amount (sealed output)</text>
  <text x="790" y="670" text-anchor="middle" fill="#888780" font-size="11">Nobody else can see it</text>
</svg>
